packages:
  - '.'
allowBuilds:
  '@apollo/protobufjs': true
  '@swc/core': true
  argon2: true
  protobufjs: true
  # Dependencias de Jest 30: traen binarios precompilados como dependencias
  # opcionales; sus scripts solo compilan/descargan si falta el binario.
  '@parcel/watcher': false
  unrs-resolver: false
overrides:
  # Vulnerabilidades en dependencias fijadas por otras librerías:
  # @nestjs/graphql 13 fija utils 12.0.0, exceljs usa uuid 8, y mailparser
  # y preview-email (vista previa de correos del mailer) fijan nodemailer 9.
  '@graphql-tools/utils@12.0.0': 12.0.1
  'exceljs>uuid': ^11.1.1
  'nodemailer@9': ^10.1.7
